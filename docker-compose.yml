version: '3.8'

services:
  kali-mcp:
    build: .
    container_name: kali-mcp-server
    hostname: kali-mcp
    # Add network capabilities for scanning tools
    cap_add:
      - NET_RAW
      - NET_ADMIN
    # Security options
    security_opt:
      - no-new-privileges:true
    # Resource limits
    mem_limit: 2g
    cpus: 2
    # Network mode
    network_mode: bridge
    # Volumes for persistent data
    volumes:
      - ./scans:/home/pentester/scans:rw
      - ./wordlists:/home/pentester/wordlists:ro
    # Environment variables
    environment:
      - PYTHONUNBUFFERED=1
      - MAX_TIMEOUT=300
    # Restart policy
    restart: unless-stopped
    # Stdin open for MCP communication
    stdin_open: true
    tty: true